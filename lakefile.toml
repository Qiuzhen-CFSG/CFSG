name = "CFSG"
defaultTargets = [
    "Challenge",
    "Solution",
]
lintDriver = "batteries/runLinter"

enableArtifactCache = true
restoreAllArtifacts = true

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[require]]
name = "Comparator"
git = "https://github.com/leanprover/comparator.git"
rev = "v4.33.0"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "FeitThompson"

[[lean_lib]]
name = "BenderSuzuki"

[[lean_lib]]
name = "GorensteinWalter"

[[lean_lib]]
name = "BenderGlauberman"

[[lean_lib]]
name = "Theory"

[[lean_lib]]
name = "Glauberman"

[[lean_lib]]
name = "BaerSuzuki"
