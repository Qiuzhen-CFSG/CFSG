name = "CFSG"
defaultTargets = ["FeitThompson", "BenderSuzuki"]
lintDriver = "batteries/runLinter"

enableArtifactCache = true
restoreAllArtifacts = true

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "FeitThompson"

[[lean_lib]]
name = "BenderSuzuki"

[[lean_lib]]
name = "BenderSuzukiConverse"
srcDir = "comparator"
globs = ["BenderSuzukiConverse.+"]

[[lean_lib]]
name = "BenderSuzukiTheorem"
srcDir = "comparator"
globs = ["BenderSuzukiTheorem.+"]

[[lean_lib]]
name = "GlaubermanZJ"
srcDir = "comparator"
globs = ["GlaubermanZJ.+"]
