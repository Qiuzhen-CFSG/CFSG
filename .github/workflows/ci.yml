name: CI

on:
  push:
    branches: ["main"] # replace "main" with the default branch
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false

      # The comparator challenges state the repository's headline results over Mathlib
      # alone, and each is discharged by a solution.  They are outside `defaultTargets`,
      # so without this step nothing checks them.
      - name: Build the comparator challenges and solutions
        run: lake build BenderSuzukiConverse BenderSuzukiTheorem GlaubermanZJ
